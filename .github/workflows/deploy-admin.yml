name: Deploy Admin Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "admin_dashboard_web/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dandivps-deploy-production
  cancel-in-progress: false

env:
  PROJECT_SLUG: dandivps-deploy
  DEPLOY_TARGET: /var/www/apps/dandivps-deploy
  VERIFY_URL: http://202.10.47.56:8081/

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_dashboard_web/package-lock.json

      - name: Install dependencies
        working-directory: admin_dashboard_web
        run: npm ci

      - name: Check source
        working-directory: admin_dashboard_web
        run: npm run lint

      - name: Build production website
        working-directory: admin_dashboard_web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/dandivps_deploy
          printf '%s\n' '202.10.47.56 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILZYLxCuBpW418DtQOIHrl/LVLo+3Q/eVLYExBn/2WFt' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dandivps_deploy ~/.ssh/known_hosts

      - name: Upload release to staging directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dandivps_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "install -d -m 755 \"\$HOME/deploy-staging/$PROJECT_SLUG\" \"\$HOME/backups/$PROJECT_SLUG\""
          rsync --archive --delete \
            -e "ssh -i ~/.ssh/dandivps_deploy -p $VPS_PORT" \
            admin_dashboard_web/dist/ \
            "$VPS_USER@$VPS_HOST:deploy-staging/$PROJECT_SLUG/"

      - name: Publish release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/dandivps_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "PROJECT_SLUG='$PROJECT_SLUG' DEPLOY_TARGET='$DEPLOY_TARGET' bash -se" <<'REMOTE'
          set -euo pipefail
          readonly target="$DEPLOY_TARGET"
          readonly staging="$HOME/deploy-staging/$PROJECT_SLUG"
          readonly backup_dir="$HOME/backups/$PROJECT_SLUG"
          readonly backup="$backup_dir/previous.tar.gz"

          test "$target" = '/var/www/apps/dandivps-deploy'
          test -d "$target"
          test -w "$target"
          test -f "$staging/index.html"
          command -v rsync >/dev/null

          install -d -m 755 "$backup_dir"
          tar -C "$target" -czf "$backup" .
          rsync --archive --delete "$staging/" "$target/"
          test -f "$target/index.html"
          REMOTE

      - name: Verify website response
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 "$VERIFY_URL" > /dev/null
